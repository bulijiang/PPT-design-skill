# —— 项目基本信息 ——
project:
  name: "联友SCM技术说明（汉德车桥）"
  presentation_type: "技术说明会"
  presenter: "待补充"                         # 演讲者，封面才用，正文9页不强需
  date: "2026-08-xx 待补充"                    # 汇报日期，封面才用
  client: "主机厂类客户 IT部门 + 供应链业务部门（材料通用，不限单一客户）"

# —— 交付规范 ——
delivery:
  max_pages: 10                                 # 正文10页（封面/封底另计，不在本轮范围）
  page_numbering: "continuous"                  # 连续页码 P1-P10
  appendix_pages: false
  output_directory: "/Users/bulijiang/供应链项目/H-汉德车桥SCM项目/联友SCM技术说明-PPT页面设计/"

# —— 受众约束 ——
audience:
  primary_role: "主机厂类客户 IT部门 + 供应链业务部门（双受众，材料通用）"
  technical_level: "mixed"                      # IT技术中等、业务技术弱
  forbidden_topics:
    - "出现'业务使能平台'字眼（统一用MP3.X平台）"
    - "出现内部别名原词：致博/致博流程、极样/极样平台、友码、原子能力知识库（折叠为平台能力口径）"
    - "出现内部人员姓名（刘星龙/武海春/郭权/梁浩霖/王军/骆健兴/田灏等）"
    - "出现客户公司名（'汉德车桥'/'汉德'等，材料通用不限单一客户）"
    - "出现标杆客户名（DHAC/东风/东风商城等，或将其直接等同为客户本身——标杆仅平台技术层复用、业务应用层按客户适配）"
    - "杜撰未对齐的具体值（容灾RPO/RTO、客户实际接口/ERP编码、展算物料具体分类）"
    - "贬低客户现有数字化水平或IT团队"
  required_terminology:
    - "MP3.X平台"                    # 唯一对外平台称谓
    - "运行底座"                     # MP3.X双面之一
    - "开发使能"                     # MP3.X双面之二
    - "四层数据建模"                 # 映射→约定→元素→模型
    - "主机厂批次"                   # DHAC批次→汉德口径
    - "供应商批次"
    - "企业商城"                     # 东风商城→汉德口径
    - "平台工作流配置能力"           # 致博流程折叠
    - "可视化主题配置"               # 极样折叠
    - "AI开发助手"                   # 友码折叠
    - "能力资产库"                   # 原子能力知识库折叠
    - "国产化/信创"                  # 自主可控主线

# —— 内容/合规约束 ——
content:
  data_confidentiality: "internal"
  competitor_mentions: "none"                  # 不引用同行案例
  referenced_companies:
    - "DHAC（东风本田汽车零部件）— 业务应用层参考标杆，平台技术层直接复用，非汉德本身"
  key_constraints:
    - "每页只传达一个核心信息（单一结论原则）"
    - "颜色不超3种（主色+辅助色+强调色），功能性浅灰/极浅蓝灰不计入"
    - "待对齐具体值统一标注'按汉德实际适配/实施期对齐'，不杜撰"
    - "国产化/信创内容用主色或强调色标注，不引入第4种颜色"

# —— 叙事结构约束 ——
narrative:
  structure: "单篇10页技术说明（不分幕）"
  hidden_thread: "业务全景代入 → 总体架构 → 四大支柱 → 两翼保障 → 平台能力全景 → 价值主张收束"
  page_flow:
    - "第1页 业务全景：双受众代入"
    - "第2页 总体技术架构：从业务落到技术总览"
    - "第3-6页 数据/集成/部署/安全：技术四大支柱逐项"
    - "第7-8页 定制开发/运维DevOps：两翼保障"
    - "第9页 MP3.X平台能力全景：双面18项能力+技术栈速览"
    - "第10页 价值主张收束：前9页能力归结为双引擎价值"

# —— 视觉约束 ——
visual:
  must_include:
    - "每页页眉区：左侧主标题+副标题（上下两行靠左），右侧预留Logo占位空位置（联友科技Logo由用户统一手动粘贴，方案不生成具体Logo图形）"
    - "架构图（四层架构/集成拓扑/部署拓扑/四层安全纵深/DevOps闭环）使用扁平化架构图风格"
    - "国产化/信创相关内容（达梦数据库、自主源码、信创合规）用主色或强调色标注"
    - "底部品牌蓝(#1F4E79)横条收束语"
    - "每页正文可见字数控制在moderate≤80字或dense≤150字"
  must_not_include:
    - "花哨动画效果（仅允许淡入淡出过渡）"
    - "过多装饰性图标（每页图标注解≤4个）"
    - "3D立体效果图表（保持扁平化）"
    - "超过3种颜色同时出现在同一视觉层级"
    - "'业务使能平台'字眼、内部别名原词、内部人员姓名"
